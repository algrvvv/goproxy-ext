<!doctype html>
<html lang="en">
  <head>
    <title>goproxy connector</title>
    <style>
      body {
        width: 450px;
        font-family: Arial, Helvetica, sans-serif;
      }

      #status {
        margin: 10px 0;
      }

      button {
        display: block;
        width: 100%;
        padding: 10px;
        margin: 10px 0;
      }

      input {
        display: block;
        width: 100%;
        margin: 5px 0;
        padding: 8px;
        box-sizing: border-box;
      }

      label {
        font-size: 14px;
        margin-top: 10px;
      }

      .error-message {
        color: rgb(220 38 38);
      }
    </style>
  </head>

  <body>
    <h1>GoProxy Status</h1>
    <div id="status">Loading...</div>
    <div id="ip">Loading...</div>

    <label for="host">Host</label>
    <input type="text" id="host" placeholder="Enter proxy host" />

    <label for="port">Port</label>
    <input type="number" id="port" placeholder="Enter proxy port" />

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" />

    <button id="connectProxy">Connect</button>
    <button id="disconnectProxy">Disconnect</button>

    <span id="error" class="error-message"></span>
    <script src="popup.js"></script>
  </body>
</html>
